<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>AutoFlow Run</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;padding:9px 11px;color:#eef5fa;background:#142130;font:12px system-ui;border:1px solid #4c677e;border-radius:8px;display:flex;flex-direction:column;gap:7px}header{-webkit-app-region:drag;display:flex;justify-content:space-between;font-weight:700;flex-shrink:0}#state{color:#6ed9b3}#text{flex:1;min-height:0;margin:0;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap;font-size:12px;line-height:17px;color:#c9d7e4}nav{display:flex;gap:7px;flex-shrink:0}button{-webkit-app-region:no-drag;border:0;border-radius:5px;padding:6px 8px;color:white;background:#365573;flex:1;cursor:pointer;font:12px system-ui;white-space:nowrap}#stop{background:#9e3d47}button[hidden]{display:none}
nav[hidden]{display:none}button:disabled{opacity:.5;cursor:default}
</style></head><body><header><span>AutoFlow</span><span id="state">Ready</span></header><p id="text"></p><nav id="debug-tools" hidden><button id="capture">Capture offset</button><button id="delay">Resume in 2s</button></nav><nav><button id="continue" hidden>Continue</button><button id="ignore" hidden>Ignore</button><button id="pause">Pause</button><button id="stop">Stop</button></nav><script src="overlay.js"></script></body></html>
